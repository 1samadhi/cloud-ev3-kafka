# =============================================================================
#  Pedidos360 — configuración común de los 3 nodos RabbitMQ (rabbitmq1/2/3)
#
#  Se monta igual en los tres contenedores: un clúster sólo es predecible si
#  todos sus nodos comparten la misma configuración. Lo que cambia por nodo
#  (hostname = nombre del nodo) lo pone el docker-compose.yml.
#
#  OJO: una clave desconocida o mal escrita impide que el nodo arranque. Sólo se
#  usan claves documentadas para la 3.13.
# =============================================================================

# --- Formación del clúster ----------------------------------------------------
# classic_config: la lista de pares es FIJA y conocida de antemano. Es el
# mecanismo más simple y determinista para un compose: no depende de DNS SRV,
# Consul, etcd ni de la API de Kubernetes. Cada nodo, al arrancar sin datos,
# intenta unirse al primer par alcanzable de esta lista; si ninguno responde,
# arranca solo (por eso el compose hace que rabbitmq2/3 esperen a que rabbitmq1
# esté sano: evita que dos nodos arranquen "solos" a la vez y formen dos
# clústeres distintos).
#
# El nombre de cada nodo es rabbit@<hostname>; por eso el compose fija el
# hostname. Si el hostname cambiara (p. ej. el id aleatorio del contenedor),
# el nodo dejaría de reconocer sus propios datos en el volumen.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq2
cluster_formation.classic_config.nodes.3 = rabbit@rabbitmq3

# Nombre legible del clúster: es lo que muestra la UI de management y lo que
# devuelve ms-rabbit-admin en GET /api/rabbit/cluster.
cluster_name = pedidos360

# --- Particiones de red ---------------------------------------------------------
# pause_minority: si la red se parte, el lado con MINORÍA de nodos (1 de 3) se
# pausa solo en vez de seguir aceptando escrituras que después habría que
# reconciliar a mano. Con 3 nodos siempre hay un lado mayoritario (2) que sigue
# atendiendo. Es la estrategia recomendada para clústeres de número impar.
# (Las colas quorum ya resuelven su consistencia con Raft; esto cubre al resto
# del estado del clúster: usuarios, exchanges, bindings.)
cluster_partition_handling = pause_minority

# --- Colas quorum: réplicas que se reparan solas ------------------------------
# Una cola quorum toma sus réplicas de los nodos que están en el clúster EN EL
# MOMENTO de declararla. Si un microservicio la declara cuando sólo rabbitmq1
# se unió, la cola queda con 1 réplica y no tolera ninguna caída. La
# reconciliación continua (disponible desde 3.13) hace crecer las réplicas
# hasta 3 en cuanto los otros nodos se suman, sin intervención manual.
# 3 réplicas = mayoría de 2: se tolera la caída de 1 nodo sin perder mensajes
# confirmados ni disponibilidad. Con 2 nodos la mayoría sería 2 y NO se
# toleraría ninguna caída; por eso el clúster tiene 3.
quorum_queue.continuous_membership_reconciliation.enabled = true
quorum_queue.continuous_membership_reconciliation.target_group_size = 3

# --- Recursos -----------------------------------------------------------------
# El compose limita cada contenedor a 512 MB. Se usa un umbral ABSOLUTO porque
# el relativo se calcula sobre la RAM que ve el proceso, que en un contenedor
# puede ser la del host completo: el nodo creería tener gigas y el kernel lo
# mataría (OOM) antes de que RabbitMQ frenara a los publicadores.
vm_memory_high_watermark.absolute = 384MB

# Bajo este espacio libre RabbitMQ bloquea a los publicadores en vez de llenar
# el disco y corromper los segmentos de las colas quorum.
disk_free_limit.absolute = 1GB

# --- Listeners y logs -------------------------------------------------------------
# Dentro del contenedor los tres usan los puertos estándar; el compose los
# publica en el host como 5672/5673/5674 y 15672/15673/15674.
listeners.tcp.default = 5672
management.tcp.port = 15672

# Logs a la consola: `docker compose logs -f rabbitmq2` es la evidencia de que
# el nodo se unió al clúster ("node rabbit@rabbitmq2 up" en los demás).
log.console = true
log.console.level = info
